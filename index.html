<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Web File Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #11111b; color: #cdd6f4; height: 100vh; display: flex; flex-direction: column; padding: 12px; gap: 12px; }
    
    /* Top Toolbar */
    .toolbar { display: flex; align-items: center; justify-content: space-between; background: #1e1e2e; padding: 10px 14px; border-radius: 8px; border: 1px solid #313244; }
    .status { font-size: 11px; font-weight: bold; color: #a6e3a1; transition: opacity 0.3s; }
    
    /* File Selector Bar */
    .file-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .file-tab { background: #181825; border: 1px solid #313244; color: #a6adc8; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .file-tab.active { background: #89b4fa; color: #11111b; border-color: #89b4fa; }
    .btn-add { background: #313244; color: #89b4fa; font-weight: bold; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

    /* Action Bar (Rename, Delete, Share) */
    .action-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-action { flex: 1; background: #1e1e2e; border: 1px solid #313244; color: #cdd6f4; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-action.danger { color: #f38ba8; }
    .btn-action.primary { background: #89b4fa; color: #11111b; }

    /* Text / Code Editor */
    .editor-container { flex: 1; display: flex; flex-direction: column; }
    textarea { width: 100%; height: 100%; background: #1e1e2e; border: 1px solid #313244; border-radius: 8px; color: #f5e0dc; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.5; outline: none; resize: none; }
  </style>
</head>
<body>

  <!-- Top Status -->
  <div class="toolbar">
    <strong id="currentFileName" style="font-size: 14px;">main.py</strong>
    <span id="saveStatus" class="status">Saved</span>
  </div>

  <!-- File List Tabs -->
  <div class="file-bar" id="fileBar"></div>

  <!-- Action Controls -->
  <div class="action-bar">
    <button class="btn-action" onclick="renameFile()">✏️ Rename</button>
    <button class="btn-action danger" onclick="deleteFile()">🗑️ Delete</button>
    <button class="btn-action" onclick="shareFile()">📤 Share</button>
    <button class="btn-action primary" onclick="exportFile()">💾 Download</button>
  </div>

  <!-- Live Editor -->
  <div class="editor-container">
    <textarea id="editor" placeholder="Type code or notes here..." spellcheck="false"></textarea>
  </div>

  <script>
    // 1. Initial Storage Setup
    let files = JSON.parse(localStorage.getItem('pymobile_editor_files')) || {
      'main.py': '# Python Live File\nprint("Auto-saving active!")',
      'notes.txt': 'Project design specifications'
    };
    let activeFile = localStorage.getItem('pymobile_active_file') || 'main.py';

    const editor = document.getElementById('editor');
    const status = document.getElementById('saveStatus');
    const currentFileNameDisplay = document.getElementById('currentFileName');

    // 2. Load Active File Content
    function loadFile(fileName) {
      if (!files[fileName]) {
        fileName = Object.keys(files)[0] || 'main.py';
      }
      activeFile = fileName;
      localStorage.setItem('pymobile_active_file', activeFile);
      currentFileNameDisplay.textContent = activeFile;
      editor.value = files[activeFile] || '';
      renderTabs();
    }

    // 3. Auto-Save as You Type
    editor.addEventListener('input', () => {
      status.textContent = 'Saving...';
      status.style.color = '#f9e2af';
      
      files[activeFile] = editor.value;
      localStorage.setItem('pymobile_editor_files', JSON.stringify(files));

      setTimeout(() => {
        status.textContent = 'Saved';
        status.style.color = '#a6e3a1';
      }, 300);
    });

    // 4. Render File Tabs
    function renderTabs() {
      const fileBar = document.getElementById('fileBar');
      fileBar.innerHTML = '';
      
      Object.keys(files).forEach(fileName => {
        const tab = document.createElement('button');
        tab.className = `file-tab ${fileName === activeFile ? 'active' : ''}`;
        tab.textContent = fileName;
        tab.onclick = () => loadFile(fileName);
        fileBar.appendChild(tab);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'btn-add';
      addBtn.textContent = '+ New File';
      addBtn.onclick = createNewFile;
      fileBar.appendChild(addBtn);
    }

    // 5. Create New File
    function createNewFile() {
      const name = prompt('Enter new file name:', 'script.py');
      if (name && name.trim() !== '') {
        const cleanName = name.trim();
        files[cleanName] = '';
        localStorage.setItem('pymobile_editor_files', JSON.stringify(files));
        loadFile(cleanName);
      }
    }

    // 6. Rename Active File
    function renameFile() {
      const newName = prompt('Enter new file name:', activeFile);
      if (newName && newName.trim() !== '' && newName !== activeFile) {
        const cleanName = newName.trim();
        files[cleanName] = files[activeFile];
        delete files[activeFile];
        localStorage.setItem('pymobile_editor_files', JSON.stringify(files));
        loadFile(cleanName);
      }
    }

    // 7. Delete Active File
    function deleteFile() {
      if (Object.keys(files).length <= 1) {
        alert('You must keep at least one file!');
        return;
      }
      if (confirm(`Delete ${activeFile}?`)) {
        delete files[activeFile];
        localStorage.setItem('pymobile_editor_files', JSON.stringify(files));
        const nextFile = Object.keys(files)[0];
        loadFile(nextFile);
      }
    }

    // 8. Share File (iPhone Native Share Sheet)
    async function shareFile() {
      const content = files[activeFile];
      if (navigator.share) {
        try {
          await navigator.share({
            title: activeFile,
            text: content
          });
        } catch (err) {
          console.log('Share canceled');
        }
      } else {
        navigator.clipboard.writeText(content);
        alert('File contents copied to clipboard!');
      }
    }

    // 9. Manual Export / Download File
    function exportFile() {
      const blob = new Blob([files[activeFile]], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = activeFile;
      a.click();
    }

    // Initial Load
    loadFile(activeFile);
  </script>
</body>
</html>
